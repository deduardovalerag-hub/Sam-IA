<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sam IA - v1.0</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .chat-container {
            width: 100%;
            max-width: 400px;
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #334155;
            height: 85vh;
        }
        .chat-header {
            background: #0f172a;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            border-bottom: 1px solid #334155;
            color: #38bdf8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .app-version {
            font-size: 11px;
            background: #334155;
            padding: 2px 6px;
            border-radius: 6px;
            color: #94a3b8;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 85%;
            line-height: 1.4;
            font-size: 14px;
        }
        .message.ai {
            background: #334155;
            color: #f8fafc;
            align-self: flex-start;
        }
        .message.user {
            background: #0284c7;
            color: #ffffff;
            align-self: flex-end;
        }
        .chat-input-area {
            display: flex;
            padding: 12px;
            background: #0f172a;
            border-top: 1px solid #334155;
            gap: 8px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 14px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
        }
        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #0369a1;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <span>Sam IA</span>
            <span class="app-version">v1.0</span>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message ai">Hola, soy Sam IA (v1.0). Escribe <b>"mundial"</b> o un idioma (ej. <b>"mundial ingles"</b>, <b>"japones"</b>, <b>"frances"</b>, <b>"portugues"</b>) para ver el reloj mundial, o haz operaciones matemáticas.</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Escribe tu mensaje..." autocomplete="off">
            <button onclick="procesarMensaje()">Enviar</button>
        </div>
    </div>

    <script>
        const inputField = document.getElementById('userInput');
        const chatMessages = document.getElementById('chatMessages');

        inputField.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                procesarMensaje();
            }
        });

        function agregarMensaje(texto, tipo) {
            const div = document.createElement('div');
            div.className = `message ${tipo}`;
            div.innerHTML = texto;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function procesarMensaje() {
            const texto = inputField.value.trim();
            if (!texto) return;

            agregarMensaje(texto, 'user');
            inputField.value = '';

            setTimeout(() => {
                let respuesta = obtenerRespuesta(texto);
                agregarMensaje(respuesta, 'ai');
            }, 300);
        }

        function obtenerRespuesta(expr) {
            let limpio = expr.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '');

            // Mostrar versión si lo pregunta
            if (limpio.includes('version') || limpio.includes('versio')) {
                return "Actualmente estoy ejecutando la versión <b>v1.0</b> de Sam IA.";
            }

            let idioma = 'es';
            let titulo = "<b>🌍 Reloj Mundial (v1.0):</b><br><br>";

            if (limpio.includes('ingles') || limpio.includes('english')) {
                idioma = 'en';
                titulo = "<b>🌍 World Clock (v1.0):</b><br><br>";
            } else if (limpio.includes('frances') || limpio.includes('french')) {
                idioma = 'fr';
                titulo = "<b>🌍 Horloge Mondiale (v1.0) :</b><br><br>";
            } else if (limpio.includes('japones') || limpio.includes('japanese')) {
                idioma = 'ja';
                titulo = "<b>🌍 世界時計 v1.0:</b><br><br>";
            } else if (limpio.includes('portugues') || limpio.includes('portuguese')) {
                idioma = 'pt';
                titulo = "<b>🌍 Relógio Mundial (v1.0):</b><br><br>";
            }

            if (limpio.includes('mundial') || limpio.includes('paises') || limpio.includes('reloj') || limpio.includes('horas') || limpio.includes('ingles') || limpio.includes('frances') || limpio.includes('japones') || limpio.includes('portugues')) {
                const zonas = [
                    { nombre: { es: '🇲🇽 México (CDMX)', en: '🇲🇽 Mexico (CDMX)', fr: '🇲🇽 Mexique (CDMX)', ja: '🇲🇽 メキシコ (CDMX)', pt: '🇲🇽 México (CDMX)' }, zona: 'America/Mexico_City' },
                    { nombre: { es: '🇺🇸 Estados Unidos (Nueva York)', en: '🇺🇸 United States (New York)', fr: '🇺🇸 États-Unis (New York)', ja: '🇺🇸 アメリカ (ニューヨーク)', pt: '🇺🇸 Estados Unidos (Nova York)' }, zona: 'America/New_York' },
                    { nombre: { es: '🇪🇸 España (Madrid)', en: '🇪🇸 Spain (Madrid)', fr: '🇪🇸 Espagne (Madrid)', ja: '🇪🇸 スペイン (マドリード)', pt: '🇪🇸 Espanha (Madrid)' }, zona: 'Europe/Madrid' },
                    { nombre: { es: '🇦🇷 Argentina (Buenos Aires)', en: '🇦🇷 Argentina (Buenos Aires)', fr: '🇦🇷 Argentine (Buenos Aires)', ja: '🇦🇷 アルゼンチン (ブエノスアイレス)', pt: '🇦🇷 Argentina (Buenos Aires)' }, zona: 'America/Argentina/Buenos_Aires' },
                    { nombre: { es: '🇯🇵 Japón (Tokio)', en: '🇯🇵 Japan (Tokyo)', fr: '🇯🇵 Japon (Tokyo)', ja: '🇯🇵 日本 (東京)', pt: '🇯🇵 Japão (Tóquio)' }, zona: 'Asia/Tokyo' },
                    { nombre: { es: '🇫🇷 Francia (París)', en: '🇫🇷 France (Paris)', fr: '🇫🇷 France (Paris)', ja: '🇫🇷 フランス (パリ)', pt: '🇫🇷 França (Paris)' }, zona: 'Europe/Paris' },
                    { nombre: { es: '🇨🇴 Colombia (Bogotá)', en: '🇨🇴 Colombia (Bogota)', fr: '🇨🇴 Colombie (Bogota)', ja: '🇨🇴 コロンビア (ボゴタ)', pt: '🇨🇴 Colômbia (Bogotá)' }, zona: 'America/Bogota' },
                    { nombre: { es: '🇧🇷 Brasil (São Paulo)', en: '🇧🇷 Brazil (São Paulo)', fr: '🇧🇷 Brésil (São Paulo)', ja: '🇧🇷 ブラジル (サンパウロ)', pt: '🇧🇷 Brasil (São Paulo)' }, zona: 'America/Sao_Paulo' }
                ];

                let resultadoHtml = titulo;
                zonas.forEach(item => {
                    let horaZona = new Date().toLocaleTimeString(idioma === 'en' ? 'en-US' : idioma === 'fr' ? 'fr-FR' : idioma === 'ja' ? 'ja-JP' : idioma === 'pt' ? 'pt-BR' : 'es-ES', { timeZone: item.zona });
                    resultadoHtml += `• ${item.nombre[idioma] || item.nombre['es']}: <b>${horaZona}</b><br>`;
                });
                return resultadoHtml;
            }

            if (limpio.includes('hora') || limpio.includes('quehoraes')) {
                const horaActual = new Date().toLocaleTimeString();
                return `La hora local actual es: <b>${horaActual}</b>`;
            }

            try {
                if (limpio.startsWith('raiz')) {
                    let num = parseFloat(limpio.replace('raiz', '').replace(/[()]/g, ''));
                    if (isNaN(num)) return "Por favor ingresa un número válido para la raíz.";
                    if (num < 0) return "No puedo calcular raíces cuadradas de números negativos.";
                    return `El resultado es: ${Math.sqrt(num)}`;
                }

                if (!/^[\d+\-*/().%\s]+$/.test(limpio)) {
                    return "Escribe una operación matemática, <b>'mundial'</b>, o pregunta por la <b>'version'</b>.";
                }

                let resultado = Function('"use strict";return (' + limpio + ')')();
                
                if (!isFinite(resultado)) {
                    return "Error matemático (división por cero).";
                }

                return `El resultado es: <b>${resultado}</b>`;
            } catch (error) {
                return "No entendí eso. Prueba escribiendo 'mundial' o 'version'.";
            }
        }
    </script>

</body>
</html>
